cat > index.html <<'HTML'
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encurtador de Ofertas</title>
<style>
  body{font-family:system-ui;max-width:520px;margin:60px auto;padding:0 20px;text-align:center}
  input{width:100%;padding:14px;font-size:16px;border:2px solid #ccc;border-radius:8px;box-sizing:border-box}
  button{margin-top:12px;padding:14px 28px;font-size:16px;background:#ee4d2d;color:#fff;border:none;border-radius:8px;cursor:pointer}
  #resultado{margin-top:20px;display:none}
  #linkCurto{padding:12px;background:#f0f0f0;border-radius:8px;word-break:break-all;font-size:14px}
  .copiar{margin-top:8px;padding:8px 16px;font-size:14px;background:#333;color:#fff;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<h2>🔗 Encurtador de Ofertas Shopee</h2>
<input id="linkLongo" placeholder="Cole o link da Shopee aqui..." />
<button onclick="gerar()">Gerar link curto</button>
<div id="resultado">
  <p>Link curto:</p>
  <div id="linkCurto"></div>
  <button class="copiar" onclick="copiar()">Copiar</button>
</div>
<script>
function gerar(){
  var longo = document.getElementById('linkLongo').value.trim();
  if(!longo){ alert('Cole o link primeiro'); return; }
  var base = location.origin + location.pathname;
  var curto = base + '?u=' + encodeURIComponent(longo);
  document.getElementById('linkCurto').textContent = curto;
  document.getElementById('resultado').style.display = 'block';
}
function copiar(){
  var t = document.getElementById('linkCurto').textContent;
  navigator.clipboard.writeText(t);
}
// redireciona se vier com ?u=
var p = new URLSearchParams(location.search);
if(p.get('u')){ location.replace(decodeURIComponent(p.get('u'))); }
</script>
</body>
</html>
