<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encurtador de Ofertas</title>
<style>
  body{font-family:system-ui;max-width:520px;margin:60px auto;padding:0 20px;text-align:center}
  input{width:100%;padding:14px;font-size:16px;border:2px solid #ccc;border-radius:8px;box-sizing:border-box}
  button{margin-top:12px;padding:14px 28px;font-size:16px;background:#ee4d2d;color:#fff;border:none;border-radius:8px;cursor:pointer}
  #resultado{margin-top:20px;display:none}
  #linkCurto{padding:12px;background:#f0f0f0;border-radius:8px;word-break:break-all;font-size:14px}
</style>
</head>
<body>
<h2>🔗 Encurtador de Ofertas</h2>
<input id="linkLongo" placeholder="Cole o link da Shopee aqui (s.shopee.com.br)..." />
<button onclick="gerar()">Gerar link curto</button>
<div id="resultado">
  <p>Seu link curto:</p>
  <div id="linkCurto"></div>
  <button onclick="copiar()" style="margin-top:8px;background:#333">Copiar</button>
</div>
<p id="msg" style="color:#888;font-size:13px;margin-top:20px"></p>
<script>
async function gerar(){
  const longo = document.getElementById('linkLongo').value.trim();
  if(!longo) return alert('Cole o link primeiro');
  document.getElementById('msg').textContent = 'Gerando...';
  try {
    const res = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(longo)}`);
    const data = await res.json();
    if(data.shorturl){
      document.getElementById('linkCurto').textContent = data.shorturl;
      document.getElementById('resultado').style.display = 'block';
      document.getElementById('msg').textContent = 'Pronto! Link limpo e pronto pra usar no Telegram/TikTok.';
    } else { throw new Error(); }
  } catch(e){
    document.getElementById('msg').textContent = 'Erro, tente novamente.';
  }
}
function copiar(){
  navigator.clipboard.writeText(document.getElementById('linkCurto').textContent);
  document.getElementById('msg').textContent = 'Copiado!';
}
</script>
</body>
</html>
